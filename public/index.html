<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QUACK GANG — Whitelist</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="page">
  <img src="final-design.jpg" class="design" alt="QUACK GANG Whitelist">

  <div class="overlay">
    <a class="nav home" href="#home" aria-label="Home"></a>
    <a class="nav about" href="#about" aria-label="About"></a>
    <a class="nav faq" href="#faq" aria-label="FAQ"></a>
    <a class="nav join" href="#whitelist" aria-label="Join the Gang"></a>

    <a class="task follow" href="https://x.com/quackgangrh" target="_blank" rel="noopener" data-task="follow" aria-label="Follow QUACK GANG"></a>
    <a class="task repost" href="https://x.com/quackgangrh/status/2095050569119674381" target="_blank" rel="noopener" data-task="repost" aria-label="Repost pinned post"></a>
    <a class="task like" href="https://x.com/quackgangrh/status/2095050569119674381" target="_blank" rel="noopener" data-task="like" aria-label="Like pinned post"></a>
    <a class="task comment" href="https://x.com/quackgangrh/status/2095050569119674381" target="_blank" rel="noopener" data-task="comment" aria-label="Comment GANG"></a>

    <input id="commentLink" class="comment-link" type="url" placeholder="Paste your comment link here..." autocomplete="off" aria-label="GANG comment link">

    <span class="check follow-check">✓</span>
    <span class="check repost-check">✓</span>
    <span class="check like-check">✓</span>
    <span class="check comment-check">✓</span>

    <input id="wallet" class="wallet" type="text" placeholder="Enter your wallet address (0x...)" autocomplete="off" aria-label="Wallet address">
    <button id="submit" class="submit" type="button" aria-label="Submit and join the gang"></button>
    <div id="message" role="status" aria-live="polite"></div>

    <span id="home"></span>
    <span id="about"></span>
    <span id="faq"></span>
    <span id="whitelist"></span>
  </div>
</main>

<div id="infoModal" class="modal" aria-hidden="true">
  <div class="modal-box">
    <button id="closeModal" class="modal-close" type="button" aria-label="Close">×</button>
    <h2 id="modalTitle"></h2>
    <div id="modalBody"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
