<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QUACK GANG — Whitelist</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="page">
  <img src="final-design.jpg" class="design" alt="QUACK GANG Whitelist">
  <div class="overlay">

    <a class="nav home" href="#home" aria-label="Home"></a>
    <a class="nav about" href="#about" aria-label="About"></a>
    <a class="nav faq" href="#faq" aria-label="FAQ"></a>
    <a class="nav join" href="#whitelist" aria-label="Join the Gang"></a>

    <a class="task follow" href="https://x.com/quackgangrh" target="_blank" rel="noopener" data-task="follow"></a>
    <a class="task repost" href="https://x.com/quackgangrh/status/2095050569119674381" target="_blank" rel="noopener" data-task="repost"></a>
    <a class="task like" href="https://x.com/quackgangrh/status/2095050569119674381" target="_blank" rel="noopener" data-task="like"></a>
    <a class="task comment" href="https://x.com/quackgangrh/status/2095050569119674381" target="_blank" rel="noopener" data-task="comment"></a>

    <input id="commentLink" class="comment-link" type="url"
      placeholder="Paste your comment link here..." autocomplete="off"
      aria-label="GANG comment link">

    <span class="check follow-check">✓</span>
    <span class="check repost-check">✓</span>
    <span class="check like-check">✓</span>
    <span class="check comment-check">✓</span>

    <input id="wallet" class="wallet" type="text"
      placeholder="Enter your wallet address (0x...)" autocomplete="off"
      aria-label="Wallet address">

    <button id="submit" class="submit" aria-label="Submit and join the gang"></button>
    <div id="message"></div>

    <span id="home"></span>
    <span id="about"></span>
    <span id="faq"></span>
    <span id="whitelist"></span>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
